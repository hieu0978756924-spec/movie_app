name: movie_app
description: "Ứng dụng xem phim Góc Phim"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.7.0
  injectable: ^2.4.4
  go_router: ^14.8.1
  dartz: ^0.10.1

  # Networking & Backend
  dio: ^5.9.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.9.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Media & UI Components
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.2.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  json_serializable: ^6.9.4
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/



